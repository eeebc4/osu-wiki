name: Label pull request
on:
  pull_request_target:
    branches:
      - master
    types:
      - opened
      - edited

jobs:
  labeler:
    permissions:
      contents: read # reading changed files of pr
      pull-requests: write # adding labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7.0.0
